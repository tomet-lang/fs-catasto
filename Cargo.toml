[workspace]
resolver = "3"
members = [
    "app",
    "crates/catasto-core",
    "crates/catasto-digest",
    "crates/catasto-git",
]

default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
catasto-core = { path = "crates/catasto-core" }
catasto-digest = { path = "crates/catasto-digest" }
catasto-git = { path = "crates/catasto-git" }
catasto-cli = { path = "app" }

jobserver-gate = { git = "https://github.com/tomet-lang/jobserver-gate.git" }

#= Tomet
motem = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-ast = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-config = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-load = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-load-config = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-parser = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-printer = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-semantics = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-tree = { git = "https://github.com/tomet-lang/tomet.git" }
tomet-workspace = { git = "https://github.com/tomet-lang/tomet.git" }

#= Crates.io
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
