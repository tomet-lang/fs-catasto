[package]
name                   = "catasto-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description            = "Filesystem schema, manifest, and lockfile CLI."
publish                = false

[[bin]]
name = "catasto"
path = "src/main.rs"

[dependencies]
catasto-core     = { workspace = true }
catasto-manifest = { workspace = true }
#---
tomet-config      = { workspace = true }
tomet-load-config = { workspace = true }
tomet-spec        = { workspace = true }
#=--- Crates.io ---
anyhow         = { workspace = true }
clap           = { workspace = true }
jobserver-gate = { workspace = true }
mimalloc       = { workspace = true }
serde_json     = { workspace = true }

[dev-dependencies]
serde_json                = { workspace = true }
tempfile                  = { workspace = true }
tomet-ast-parser          = { workspace = true }
tomet-semantics           = { workspace = true }
tomet-validator-blueprint = { workspace = true }
